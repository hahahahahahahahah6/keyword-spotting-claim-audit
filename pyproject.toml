[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keyword-spotting-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented audio trigger claims"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

[project.scripts]
keyword-spotting-claim-audit = "keyword_spotting_claim_audit.audit:main"

[tool.setuptools]
packages = ["keyword_spotting_claim_audit", "tests"]
